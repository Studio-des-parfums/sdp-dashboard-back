name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Tests API & Résilience aux crashs (Vitest)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 API & Resilience Tests (Vitest)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      RESEND_API_KEY: fake-resend-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  # ──────────────────────────────────────────────
  # 2. Typecheck TypeScript
  # ──────────────────────────────────────────────
  typecheck:
    name: 🔎 TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck
